[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morningreport"
version = "0.1.0"
description = "Local tooling for the Sage Project Morning Report module"
requires-python = ">=3.10"
dependencies = ["click>=8.1"]

[project.optional-dependencies]
model = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.scripts]
morningreport = "morningreport.cli:main"

[tool.setuptools.packages.find]
include = ["morningreport*"]

[tool.setuptools.package-data]
morningreport = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
