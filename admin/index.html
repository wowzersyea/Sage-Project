<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sage Project | Faculty Admin — Assessment Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --sage-50:#1a1f1a;--sage-100:#252b25;--sage-200:#333b33;--sage-300:#4a5a4b;
  --sage-400:#6a806c;--sage-500:#7fa882;--sage-600:#8fbf92;--sage-700:#a8d4ab;
  --sage-800:#c5e5c7;--sage-900:#e8f5e9;
  --accent-coral:#e07a5f;--accent-gold:#d4a574;--accent-sky:#81b0c4;
  --text-primary:#e0e8e0;--text-secondary:#9bb09d;--text-muted:#6a806c;
  --surface:#181c18;--surface-raised:#1e231e;
  --radius-sm:8px;--radius-md:12px;--radius-lg:20px;
  --shadow-md:0 4px 12px rgba(0,0,0,.3);--shadow-lg:0 12px 32px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:var(--surface);color:var(--text-primary);line-height:1.55;min-height:100vh}
a{color:var(--accent-sky)}
.wrap{max-width:1100px;margin:0 auto;padding:2rem 1.25rem 5rem}

/* Gate */
.gate{max-width:380px;margin:14vh auto 0;text-align:center;padding:0 1.25rem}
.gate h1{font-family:'Source Serif 4',serif;font-size:1.6rem;font-weight:600;margin-bottom:.4rem}
.gate p{color:var(--text-secondary);font-size:.92rem;margin-bottom:1.5rem}
.gate input{width:100%;padding:.85rem 1rem;background:var(--surface-raised);border:1px solid var(--sage-200);
  border-radius:var(--radius-sm);color:var(--text-primary);font-size:1rem;font-family:inherit;margin-bottom:.75rem}
.gate input:focus{outline:none;border-color:var(--sage-500)}
.btn{display:inline-block;width:100%;padding:.85rem 1rem;background:var(--sage-500);color:#0d120d;border:none;
  border-radius:var(--radius-sm);font-size:.95rem;font-weight:600;font-family:inherit;cursor:pointer;transition:background .2s}
.btn:hover{background:var(--sage-600)}
.gate-err{color:var(--accent-coral);font-size:.85rem;margin-top:.75rem;min-height:1.2em}

/* Header */
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem;
  border-bottom:1px solid var(--sage-200);padding-bottom:1.25rem}
.hdr h1{font-family:'Source Serif 4',serif;font-size:1.7rem;font-weight:600}
.hdr .sub{color:var(--text-secondary);font-size:.9rem;margin-top:.2rem}
.hdr .actions{display:flex;gap:.5rem;align-items:center}
.pill{padding:.4rem .8rem;border-radius:999px;border:1px solid var(--sage-200);background:var(--surface-raised);
  color:var(--text-secondary);font-size:.82rem;cursor:pointer;transition:all .2s}
.pill:hover{border-color:var(--sage-400)}
.pill.active{background:var(--sage-500);color:#0d120d;border-color:var(--sage-500);font-weight:600}

.filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.5rem}

/* Submission list */
.list{display:flex;flex-direction:column;gap:.65rem}
.card{display:flex;align-items:center;gap:1rem;padding:1rem 1.15rem;background:var(--surface-raised);
  border:1px solid var(--sage-200);border-radius:var(--radius-md);cursor:pointer;transition:all .18s}
.card:hover{border-color:var(--sage-400);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.card .who{flex:1;min-width:0}
.card .who .name{font-weight:600;font-size:1rem}
.card .who .meta{color:var(--text-muted);font-size:.82rem;margin-top:.15rem}
.card .type{font-size:.78rem;padding:.25rem .65rem;border-radius:999px;background:rgba(129,176,196,.14);
  color:var(--accent-sky);white-space:nowrap}
.card .score{font-size:1.35rem;font-weight:700;font-family:'Source Serif 4',serif;min-width:64px;text-align:right}
.score.good{color:var(--sage-600)}.score.mid{color:var(--accent-gold)}.score.low{color:var(--accent-coral)}
.empty{text-align:center;color:var(--text-muted);padding:4rem 1rem}

/* Detail modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-start;justify-content:center;
  z-index:50;overflow-y:auto;padding:2rem 1rem}
.overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--sage-200);border-radius:var(--radius-lg);max-width:820px;
  width:100%;padding:1.75rem;box-shadow:var(--shadow-lg);margin-bottom:3rem}
.modal-hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1.25rem}
.modal-hdr h2{font-family:'Source Serif 4',serif;font-size:1.4rem}
.modal-hdr .meta{color:var(--text-secondary);font-size:.85rem;margin-top:.3rem}
.close{background:none;border:1px solid var(--sage-200);color:var(--text-secondary);border-radius:var(--radius-sm);
  padding:.35rem .7rem;cursor:pointer;font-size:.85rem}
.close:hover{border-color:var(--accent-coral);color:var(--accent-coral)}
.domain-block{margin-bottom:1.5rem}
.domain-title{font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--sage-500);
  margin-bottom:.6rem;padding-bottom:.35rem;border-bottom:1px solid var(--sage-200)}
.q{background:var(--surface-raised);border:1px solid var(--sage-200);border-radius:var(--radius-md);padding:1rem;margin-bottom:.75rem}
.q-top{display:flex;gap:.6rem;align-items:flex-start;margin-bottom:.6rem}
.q-icon{font-size:1rem;flex-shrink:0;margin-top:1px}
.q-icon.ok{color:var(--sage-600)}.q-icon.no{color:var(--accent-coral)}
.q-tier{font-size:.72rem;color:var(--text-muted);white-space:nowrap}
.q-text{font-size:.92rem;line-height:1.5}
.choices{list-style:none;display:flex;flex-direction:column;gap:.35rem;margin:.6rem 0}
.choice{font-size:.86rem;padding:.45rem .7rem;border-radius:var(--radius-sm);border:1px solid var(--sage-200);
  display:flex;gap:.5rem;align-items:flex-start}
.choice .ltr{font-weight:600;color:var(--text-muted);flex-shrink:0}
.choice.correct{background:rgba(127,168,130,.14);border-color:var(--sage-500);color:var(--sage-700)}
.choice.wrong{background:rgba(224,122,95,.12);border-color:var(--accent-coral);color:var(--accent-coral)}
.choice .tag{margin-left:auto;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.freetext{background:var(--sage-50);border-radius:var(--radius-sm);padding:.6rem .8rem;margin:.5rem 0;font-size:.87rem}
.freetext .lbl{font-size:.72rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.25rem}
.rationale{background:var(--sage-50);border-left:3px solid var(--sage-400);border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  padding:.6rem .8rem;margin-top:.5rem}
.rationale .lbl{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--sage-500);margin-bottom:.2rem}
.rationale p{font-size:.85rem;color:var(--text-secondary);line-height:1.55}
.loading{text-align:center;color:var(--text-muted);padding:4rem 1rem}
</style>
</head>
<body>

<!-- ── PASSCODE GATE ── -->
<div id="gate" class="gate">
  <h1>Faculty Admin</h1>
  <p>Enter the faculty passcode to review assessment results.</p>
  <input id="pass" type="password" placeholder="Passcode" autocomplete="current-password">
  <button class="btn" onclick="unlock()">Unlock</button>
  <div id="gate-err" class="gate-err"></div>
</div>

<!-- ── DASHBOARD ── -->
<div id="dash" class="wrap" style="display:none">
  <div class="hdr">
    <div>
      <h1>Assessment Review</h1>
      <div class="sub" id="count-sub">Loading submissions…</div>
    </div>
    <div class="actions">
      <button class="pill" onclick="loadData()">↻ Refresh</button>
      <button class="pill" onclick="logout()">Lock</button>
    </div>
  </div>
  <div class="filters" id="filters"></div>
  <div id="list" class="list"><div class="loading">Loading…</div></div>
</div>

<!-- ── DETAIL MODAL ── -->
<div id="overlay" class="overlay" onclick="if(event.target===this)closeDetail()">
  <div class="modal" id="modal"></div>
</div>

<script>
// Same Apps Script Web App URL used by the assessments.
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbzVGqv0Ot-L9BtUzcWhq8XTpmOEZSGqVFwD0kPLSRfKBFVvTlRLMdzmtWXZuaPf6adz/exec';

let ALL = [];
let FILTER = 'all';
const LETTERS = ['A','B','C','D','E','F','G','H'];

document.getElementById('pass').addEventListener('keydown', e => { if(e.key==='Enter') unlock(); });

function unlock(){
  const key = document.getElementById('pass').value.trim();
  if(!key){ return; }
  sessionStorage.setItem('sageAdminKey', key);
  loadData();
}
function logout(){
  sessionStorage.removeItem('sageAdminKey');
  document.getElementById('dash').style.display='none';
  document.getElementById('gate').style.display='block';
}

async function loadData(){
  const key = sessionStorage.getItem('sageAdminKey');
  if(!key) return;
  document.getElementById('gate-err').textContent = 'Checking…';
  try{
    const res = await fetch(ENDPOINT + '?key=' + encodeURIComponent(key));
    const data = await res.json();
    if(data.status !== 'ok'){
      document.getElementById('gate-err').textContent = 'Incorrect passcode.';
      sessionStorage.removeItem('sageAdminKey');
      return;
    }
    ALL = data.submissions || [];
    document.getElementById('gate').style.display='none';
    document.getElementById('dash').style.display='block';
    renderFilters();
    renderList();
  }catch(err){
    document.getElementById('gate-err').textContent = 'Could not reach the server. Check the endpoint URL.';
  }
}

function renderFilters(){
  const types = ['all', ...new Set(ALL.map(s => s.assessmentType || s._tab || 'Other'))];
  const el = document.getElementById('filters');
  el.innerHTML = types.map(t =>
    `<button class="pill ${t===FILTER?'active':''}" onclick="setFilter('${t.replace(/'/g,"\\'")}')">${t==='all'?'All assessments':t}</button>`
  ).join('');
}
function setFilter(t){ FILTER=t; renderFilters(); renderList(); }

function visible(){
  return FILTER==='all' ? ALL : ALL.filter(s => (s.assessmentType||s._tab)===FILTER);
}

function scoreClass(p){ return p>=80?'good':p>=60?'mid':'low'; }

function renderList(){
  const subs = visible();
  document.getElementById('count-sub').textContent =
    `${subs.length} submission${subs.length!==1?'s':''}` + (FILTER!=='all'?` · ${FILTER}`:'');
  const list = document.getElementById('list');
  if(!subs.length){ list.innerHTML = '<div class="empty">No submissions yet.</div>'; return; }
  list.innerHTML = subs.map((s,i) => {
    const idx = ALL.indexOf(s);
    const pct = (typeof s.overallScore==='number') ? s.overallScore : null;
    const date = s.timestamp ? new Date(s.timestamp).toLocaleString() : '';
    const type = s.assessmentType || s._tab || 'Assessment';
    return `<div class="card" onclick="openDetail(${idx})">
      <div class="who">
        <div class="name">${esc(s.name||'(no name)')}</div>
        <div class="meta">${esc(s.email||'')} ${date?'· '+esc(date):''}</div>
      </div>
      <div class="type">${esc(type)}</div>
      <div class="score ${pct!==null?scoreClass(pct):''}">${pct!==null?pct+'%':'—'}</div>
    </div>`;
  }).join('');
}

function openDetail(idx){
  const s = ALL[idx];
  const type = s.assessmentType || s._tab || 'Assessment';
  const date = s.timestamp ? new Date(s.timestamp).toLocaleString() : '';
  const pct = (typeof s.overallScore==='number') ? s.overallScore : null;

  let body = '';

  // Pre-rotation goals (resident assessment) — show whenever present
  if(s.goals){
    body += `<div class="domain-block"><div class="domain-title">Pre-Rotation Goals</div>`;
    Object.entries(s.goals).forEach(([k,v])=>{
      body += `<div class="freetext"><div class="lbl">${esc(k)}</div>${esc(v||'—')}</div>`;
    });
    body += `</div>`;
  }

  // Resident with raw answers only (no answer key stored — legacy/client save)
  if(!s.domains && s.answers){
    body += `<div class="domain-block"><div class="domain-title">Answers (${s.answers.length})</div>`;
    s.answers.forEach(a=>{
      body += `<div class="q"><div class="q-text"><strong>${esc(a.questionId)}</strong></div>
        <div class="freetext"><div class="lbl">Their answer</div>${esc(a.answer)}</div></div>`;
    });
    body += `</div><p style="color:var(--text-muted);font-size:.82rem">Answer key not stored for this assessment (scored server-side).</p>`;
  }
  // Domain-scored assessments
  else if(s.domains){
    s.domains.forEach(d=>{
      if(!d.answers || !d.answers.length) return;
      const dpct = d.asked ? Math.round((d.correct/d.asked)*100) : null;
      body += `<div class="domain-block"><div class="domain-title">${esc(d.domain)}${dpct!==null?` — ${dpct}%`:''}</div>`;
      d.answers.forEach(a=> body += renderQuestion(a));
      body += `</div>`;
    });
  }

  if(!body) body = '<p style="color:var(--text-muted)">No per-question detail stored for this submission.</p>';

  document.getElementById('modal').innerHTML = `
    <div class="modal-hdr">
      <div>
        <h2>${esc(s.name||'(no name)')}</h2>
        <div class="meta">${esc(type)} · ${esc(s.email||'')} ${date?'· '+esc(date):''} ${pct!==null?'· '+pct+'%':''}</div>
      </div>
      <button class="close" onclick="closeDetail()">Close ✕</button>
    </div>${body}`;
  document.getElementById('overlay').classList.add('open');
}
function closeDetail(){ document.getElementById('overlay').classList.remove('open'); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDetail(); });

function renderQuestion(a){
  const correct = a.correct===true || a.score===1;
  const icon = correct ? '<span class="q-icon ok">✓</span>' : '<span class="q-icon no">✗</span>';
  let html = `<div class="q"><div class="q-top">${icon}
    <div style="flex:1"><div class="q-text">${esc(a.question||'')}</div></div>
    ${a.tier?`<div class="q-tier">Tier ${a.tier}</div>`:''}</div>`;

  // Full multiple-choice review (med student / antimicrobial post-test)
  if(Array.isArray(a.options) && a.options.length){
    html += '<ul class="choices">';
    a.options.forEach((opt,i)=>{
      const isCorrect = i===a.correctIndex;
      const isSel = i===a.selectedIndex;
      let cls = '', tag = '';
      if(isCorrect){ cls='correct'; tag='Correct'; }
      if(isSel && !isCorrect){ cls='wrong'; tag='Their pick'; }
      if(isSel && isCorrect){ tag='Their pick · Correct'; }
      html += `<li class="choice ${cls}"><span class="ltr">${LETTERS[i]||''}</span>
        <span>${esc(opt)}</span>${tag?`<span class="tag">${tag}</span>`:''}</li>`;
    });
    html += '</ul>';
  }
  // Selected/correct text only (fallback when options not stored)
  else if(a.selected || a.correctAnswer){
    if(a.selected) html += `<div class="freetext"><div class="lbl">Their answer</div>${esc(a.selected)}</div>`;
    if(a.correctAnswer) html += `<div class="freetext"><div class="lbl">Correct answer</div>${esc(a.correctAnswer)}</div>`;
  }
  // Antimicrobial-selection free-text / concept scoring
  else if(a.detail){
    if(a.detail.text!==undefined) html += `<div class="freetext"><div class="lbl">Their response</div>${esc(a.detail.text||'(blank)')}</div>`;
    if(a.detail.nConcepts!==undefined) html += `<div class="freetext"><div class="lbl">Concepts hit</div>${a.detail.nHit}/${a.detail.nConcepts}</div>`;
    if(typeof a.score==='number') html += `<div class="freetext"><div class="lbl">Auto-score</div>${Math.round(a.score*100)}%</div>`;
  }

  if(a.rationale) html += `<div class="rationale"><div class="lbl">Rationale</div><p>${esc(a.rationale)}</p></div>`;
  html += '</div>';
  return html;
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// Auto-unlock if a key is already in this session
if(sessionStorage.getItem('sageAdminKey')) loadData();
</script>
</body>
</html>
