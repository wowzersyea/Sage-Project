name: Security Scan

# push + workflow_dispatch for the same reason as ci-shared-template:
# pull_request runs are silently skipped while a PR conflicts with main,
# and a secret scan is the last check that should quietly not run.
on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * 1"

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Basic secret scan
        run: |
          if grep -R -n -E "(sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z\\-_]{20,}|BEGIN PRIVATE KEY)" . \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.github; then
            echo "Potential secret detected"
            exit 1
          fi
          echo "No obvious secrets detected"
