name: CI Shared Template

# Triggers on every push, not just pull_request events, and deliberately:
# GitHub silently skips pull_request runs while a PR is conflicted with
# its base, and with main moving several times a day a long-lived branch
# spends much of its life conflicted — its pushes got no CI at all, with
# nothing red to say so. A push run checks the branch head itself, so it
# fires either way; a clean PR gets one extra short run, which is cheap.
# workflow_dispatch is the manual lever for re-running without a push.
on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate required governance files
        run: |
          test -f .github/CODEOWNERS
          test -f docs/governance/contribution-guide.md
          test -f docs/governance/rfc-process.md
          test -f docs/governance/release-procedures.md
      - name: Run governance validator
        run: python scripts/validate_repo_governance.py
      - name: Validate HTML subprojects exist
        run: |
          test -d asp-advisor
          test -d literature-monitor
          test -d mission-control
          test -d operations
          test -d qi-dashboard
